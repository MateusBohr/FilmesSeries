
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background-color: #1a1a1a;
            color: white;
        }
        .navbar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            background-color: #2c3e63;
            padding: 10px;
            border-radius: 10px;
            margin: 15px;
        }
        .navbar a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            padding: 5px 20px;
            border-radius: 10px;
        }
        .navbar a.active, .navbar a:hover {
            background-color: white;
            color: #2c3e63;
        }
        .cadastro-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 85vh;
        }
        .form-cadastro {
            background-color: #0d1b44;
            padding: 30px;
            border-radius: 20px;
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .form-cadastro h2 {
            text-align: center;
            background-color: white;
            color: #0d1b44;
            border-radius: 20px;
            padding: 5px;
            margin-bottom: 15px;
        }
        .form-cadastro input, .form-cadastro textarea {
            border: none;
            outline: none;
            border-radius: 20px;
            padding: 10px;
            font-size: 14px;
        }
        .form-cadastro textarea {
            resize: none;
            height: 60px;
        }
        .form-cadastro button {
            background-color: white;
            color: #0d1b44;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            padding: 10px;
            cursor: pointer;
        }
        .form-cadastro button:hover {
            background-color: #cdd3f0;
        }
    </style>
</head>
<body>
<header>
    <nav class="navbar">
        <a href="/filme-serie/listar-todos">Home</a>
        <a href="/filme-serie/adicionar" class="active">Cadastro</a>
    </nav>
</header>
<main class="cadastro-container">
    <form class="form-cadastro" action="/filme-serie/adicionar" method="post">
        <h2>CADASTRO</h2>
        <input type="text" name="titulo" placeholder="Informe o título..." required>
        <input type="number" name="ano" placeholder="Insira o ano..." min="1920" max="2025" required>
        <input type="text" name="diretor" placeholder="Informe o diretor..." required>
        <input type="text" name="genero" placeholder="Informe o gênero..." required>
        <textarea name="sinopse" placeholder="Informe uma breve sinopse..." required></textarea>
        <input type="text" name="imagem" placeholder="URL da imagem" required>
        <button type="submit">Salvar</button>
    </form>
</main>
</body>
</html>
