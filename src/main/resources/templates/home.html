<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Filmes</title>
    <style>
        body { margin: 0; font-family: "Poppins", sans-serif; background-color: #1a1a1a; color: white; }
        .navbar { display: flex; justify-content: center; gap: 2rem; background-color: #2c3e63; padding: 10px; border-radius: 10px; margin: 15px; }
        .navbar a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            padding: 5px 20px;
            border-radius: 10px;
        }
        .navbar a.active, .navbar a:hover {
            background-color: white;
            color: #2c3e63;
        }

        .home-container { padding: 20px; }
        .categoria { margin-bottom: 30px; }
        .categoria h2 { font-size: 18px; margin-bottom: 10px; }
        .grid-filmes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: left;
        }
        .grid-filmes img {
            width: 130px;
            max-height: 400px;
            object-fit: cover;
        }
        .grid-filmes img:hover { transform: scale(1.05); }
    </style>
</head>
<body>
<header>
    <nav class="navbar">
        <a th:href="@{/filme-serie/listar-todos}" class="active">Home</a>
        <a th:href="@{/filme-serie/adicionar}">Cadastro</a>
    </nav>
</header>
<main class="home-container">
    <section class="categoria">
        <h2>Todos os filmes e séries</h2>
        <div class="grid-filmes">
            <div th:each="filme : ${filmes}">
                <a th:href="@{'/filme-serie/visualizar-filmeserie/' + ${filme.id}}">
                    <img th:src="${filme.imagem}" th:alt="${filme.titulo}" />
                </a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
